<title id="title">ESP32-C3 Super Mini frontal i HC-SR04 de 5 V: connexions i corrent del divisor</title>
<desc id="desc">USB a dalt. Costat dret de la placa: 5V, GND, 3V3, GPIO4, GPIO3, GPIO2, GPIO1, GPIO0. 5V a VCC; GND comú; GPIO4 a TRIG; ECHO a R1 de 2,2 kiloohms, punt A a GPIO3 i R2 de 3,3 kiloohms a GND.</desc>
