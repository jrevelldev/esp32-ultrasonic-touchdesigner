name: Publica la guia a GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recupera el projecte
        uses: actions/checkout@v6
      - name: Prepara les descàrregues
        run: python3 tools/prepare_downloads.py
      - name: Comprova la guia
        run: |
          python3 tools/check_site.py
          node --check docs/app.js
      - name: Configura Pages
        uses: actions/configure-pages@v5
      - name: Empaqueta la web
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
